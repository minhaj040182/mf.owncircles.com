    <!-- Single Page Apps for GitHub Pages URL decode & Dynamic Head Title Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' || l.search.indexOf('?p=/') === 0) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var path = decoded.replace(/^p=/, '');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + path + l.hash
          );
        }

        // Dynamic title setter before DOM hydration for crawler optimization
        var p = (l.pathname + l.hash).toLowerCase();
        var titles = {

          "/about-us": "About Modern Fisheries | Aquaculture Solutions & Services",
          "/about": "Redirecting to About Modern Fisheries Services & Team",
          "/farming-videos": "Aquaculture Video Tutorials & Farm Guides | Modern Fisheries",

          "/frequently-asked-questions": "Fish Farming FAQ & Knowledge Base Guide | Modern Fisheries",
          "/faq": "Redirecting to Fish Farming FAQ & Knowledge Base Guide",
          "/privacy-policy": "Privacy Policy & Terms of Service | Modern Fisheries",
          "/privacy": "Redirecting to Modern Fisheries Privacy Policy & Terms"
        };

        for (var key in titles) {
          if (p.indexOf(key) !== -1) {
            document.title = titles[key];
            break;
          }
        }
      }(window.location));
    </script>
