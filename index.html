    <!-- Single Page Apps for GitHub Pages URL decode & Dynamic Head Title Script -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' || l.search.indexOf('?p=/') === 0) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&');
          }).join('?');
          var path = decoded.replace(/^p=/, '');
          window.history.replaceState(null, null,
            l.pathname.slice(0, -1) + path + l.hash
          );
        }

        // Dynamic title setter before DOM hydration for crawler optimization
        var p = (l.pathname + l.hash).toLowerCase();
        var titles = {
          "/aquaponics-farming": "Aquaponics Farming Systems & Commercial Setup | Modern Fisheries",
          "/bioflock": "Biofloc Technology (BFT) Fish Farming Guide & Setup | Modern Fisheries",
          "/aquaponic": "Recirculating Aquaculture System (RAS) Design & Setup | Modern Fisheries",
          "/hydroponic": "Hydroponics System Management & Nutrient Solutions | Modern Fisheries",
          "/pond-farming": "Earthen Pond Fish Farming & Ecosystem Management | Modern Fisheries",
          "/fish-diseases": "Fish Disease Diagnosis, Prevention & Treatment | Modern Fisheries",
          "/feeding-management": "Aquaculture Feed Management & FCR Optimization | Modern Fisheries",
          "/calculators": "Aquaculture Calculators: FCR, Tank Volume & Stocking Density | Modern Fisheries",
          "/ourservices": "Aquaculture Consultancy, RAS Design & Commercial Fish Feed Supply | Modern Fisheries",
          "/about-us": "About Modern Fisheries | Premier Aquaculture Solutions & Consultancy",
          "/farming-videos": "Aquaculture Video Tutorials & Technical Guides | Modern Fisheries",
          "/frequently-asked-questions": "Fish Farming FAQ & Aquaculture Knowledge Base | Modern Fisheries",
          "/privacy-policy": "Privacy Policy & AdSense Disclosures | Modern Fisheries"
        };

        for (var key in titles) {
          if (p.indexOf(key) !== -1) {
            document.title = titles[key];
            break;
          }
        }
      }(window.location));
    </script>
